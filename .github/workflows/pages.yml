name: Publish Workbench to Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: workbench-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Explain Pages setup when not enabled
        if: github.event.repository.has_pages != true
        run: echo '::warning::Pages not enabled. Repository admin must set Settings → Pages → Source = GitHub Actions; deployment will be skipped.'
      - name: Validate and test Workbench
        run: npm run verify
      - name: Generate public-only bundle
        run: npm run build
      - name: Upload approved public files
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    if: github.event.repository.has_pages == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
